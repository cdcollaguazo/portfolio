<article class="h-full rounded-xl border border-gray-200 p-6">

  <div class="flex items-center justify-center gap-2">
    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor">
      <use [attr.href]="stack().icon" />
    </svg>
    <h3 class="text-lg font-semibold text-gray-900">
      {{ stack().name }}
    </h3>
  </div>

  <div class="mt-5">
    <p class="mb-3 text-center text-xs font-semibold uppercase tracking-wider text-gray-500">
      Technologies
    </p>
    <div class="flex flex-wrap justify-center gap-2">
      @for (technology of stack().technologies; track $index) {
        <span
          class="rounded-full bg-gray-100 px-3 py-1 text-sm text-gray-700">
          {{ technology }}
        </span>
      }
    </div>
  </div>

  <div class="mt-5">
    <p class="mb-3 text-center text-xs font-semibold uppercase tracking-wider text-gray-500">
      Practices
    </p>
    <div class="flex flex-wrap justify-center gap-2">
      @for (practice of stack().practices; track $index) {
        <span
          class="rounded-full border border-gray-200 px-3 py-1 text-sm text-gray-600">
          {{ practice }}
        </span>
      }
    </div>
  </div>

</article>
