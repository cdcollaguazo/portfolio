name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Dependencies
        run: |
          echo "Installing node dependencies..."
          npm ci

      - name: Build Application
        run: |
          echo "Building application"
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment: Prod
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: portfolio-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Assets to S3
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          S3_BUCKET_NAME=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/s3/bucket-name" \
            --query "Parameter.Value" \
            --output text)

          echo "Uploading frontend assets to S3..."
          aws s3 sync dist/portfolio/browser s3://$S3_BUCKET_NAME --delete

      - name: Invalidate CloudFront Distribution
        env:
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
        run: |
          set -eu

          CF_DISTRIBUTION_ID=$(aws ssm get-parameter \
            --name "/${PLATFORM_NAME}/cf/distribution-id" \
            --query "Parameter.Value" \
            --output text)

          echo "Invalidating CloudFront distribution..."
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/*"
